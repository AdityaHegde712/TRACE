[project]
name = "evidence-resolution-prototype"
version = "0.1.0"
description = "Deterministic evidence-resolution contract prototype"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_resolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
