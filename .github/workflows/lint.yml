name: Lint

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --locked fails if uv.lock is stale, so CI uses the same ruff version as local.
      - run: uv sync --locked
      - run: uv run ruff check .
